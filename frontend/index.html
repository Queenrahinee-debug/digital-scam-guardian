<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Scam Guardian</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#f8f9fa;color:#212529;margin:0;padding:24px;font-size:19px;line-height:1.5}
  .container{max-width:700px;margin:0 auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.08);border:1px solid #dee2e6}
  h1{text-align:center;font-size:32px;margin:0 0 8px}
  .subtitle{text-align:center;color:#6c757d;font-size:18px;margin-bottom:22px}
  label{font-weight:bold;display:block;margin-bottom:8px}
  input,textarea{width:100%;padding:14px;font-size:18px;border:2px solid #ced4da;border-radius:8px;margin-bottom:18px;box-sizing:border-box;font-family:inherit}
  textarea{min-height:110px}
  button.main{background:#0d6efd;color:#fff;border:none;padding:16px;font-size:20px;font-weight:bold;border-radius:8px;cursor:pointer;width:100%}
  button.main:hover{background:#0b5ed7} button.main:disabled{background:#8bb4f7;cursor:wait}
  .examples{margin:-6px 0 18px;font-size:15px;color:#6c757d}
  .examples button{font-size:14px;margin:4px 6px 0 0;padding:6px 10px;border:1px solid #ced4da;border-radius:16px;background:#f1f3f5;cursor:pointer}
  .result{border-left:8px solid;padding:20px;margin-top:24px;border-radius:8px}
  .result.high{background:#fff5f5;border-color:#e53e3e} .result.mid{background:#fff8f6;border-color:#e67e22} .result.low{background:#f0fdf4;border-color:#2ecc71}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .head h2{margin:0;font-size:24px}
  .badge{display:inline-block;padding:4px 12px;font-size:14px;font-weight:bold;border-radius:20px;text-transform:uppercase;white-space:nowrap}
  .badge-high{background:#fde8e8;color:#c53030} .badge-medium{background:#fef3c7;color:#b45309} .badge-low{background:#def7ec;color:#03543f}
  .action{font-weight:bold;color:#2c3e50;margin-top:14px}
  ul{padding-left:24px} li{margin-bottom:8px}
  details{margin-top:22px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;padding:14px}
  summary{font-weight:bold;cursor:pointer;font-size:17px}
  .tech{margin-top:12px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:15px}
  .tech .row{display:flex;justify-content:space-between;font-weight:bold;color:#334155}
  .tech .desc{color:#64748b;font-size:14px}
  .note{margin-top:20px;font-size:14px;color:#6c757d;text-align:center}
</style>
</head>
<body>
<div class="container">
  <h1>🛡 Digital Scam Guardian</h1>
  <div class="subtitle">Not sure about a message? Check it here before you tap a link or send money.</div>

  <label for="senderInput">Who sent it?</label>
  <input type="text" id="senderInput" value="Mom" maxlength="100">

  <label for="messageInput">Paste the message here:</label>
  <textarea id="messageInput" maxlength="2000">Can you send 5000 rupees urgently to this new UPI ID? Don't call me.</textarea>

  <div class="examples">Try an example:
    <button type="button" data-s="Mom" data-m="Can you send 5000 rupees urgently to this new UPI ID? Don't call me.">Family asks for money</button>
    <button type="button" data-s="Unknown Support" data-m="Dear customer, your SBI account will be blocked today. Update KYC at http://sbi-update-kyc.com immediately.">Bank message with link</button>
    <button type="button" data-s="Mom" data-m="Hi beta, are you coming home for dinner tonight?">Normal chat</button>
  </div>

  <button class="main" id="scanBtn">Check this message</button>
  <div id="resultArea" aria-live="polite"></div>
  <div class="note">This is a test version. The contacts shown are made-up samples. Your message is checked on the spot and is not saved.</div>
</div>

<script>
  // Escape anything that came from the user or the server before putting it on the page (blocks HTML injection).
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Colour a "NN / 100 safety" value: green 70+, orange 40-69, red below, grey for "Not applicable".
  function valueColor(text) {
    const m = /^(\d+) \/ 100/.exec(text);
    if (!m) return "#94a3b8";
    const n = +m[1];
    return n >= 70 ? "#27ae60" : n >= 40 ? "#e67e22" : "#c53030";
  }

  function techRow(name, item) {
    return `<div class="tech"><div class="row"><span>${esc(name)}</span>
      <span style="color:${valueColor(item.value)}">${esc(item.value)}</span></div>
      <div class="desc">${esc(item.explanation)}</div></div>`;
  }

  async function checkMessage() {
    const btn = document.getElementById("scanBtn");
    const out = document.getElementById("resultArea");
    const sender = document.getElementById("senderInput").value.trim();
    const message = document.getElementById("messageInput").value.trim();
    if (!sender || !message) { out.innerHTML = "<p>Please fill in both boxes.</p>"; return; }

    btn.disabled = true;
    out.innerHTML = "<p style='text-align:center;color:#6c757d'><em>Checking message...</em></p>";
    try {
      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({sender, message})
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const d = await res.json();

      const cls = d.score_color === "red" ? "high" : d.score_color === "orange" ? "mid" : "low";
      const titleColor = cls === "high" ? "#c53030" : cls === "mid" ? "#d35400" : "#27ae60";
      const icon = cls === "low" ? "✅" : "⚠";
      const reasons = d.reasons.length ? d.reasons.map(r => `<li>${esc(r)}</li>`).join("") : "<li>We did not find anything worrying.</li>";
      const t = d.technical_breakdown;

      out.innerHTML = `
        <div class="result ${cls}">
          <div class="head"><h2 style="color:${titleColor}">${icon} ${esc(d.headline)}</h2>
            <span class="badge ${esc(d.badge_class)}">${esc(d.level_label || d.risk_level)}</span></div>
          <p class="action">${esc(d.recommended_action)}</p>
          <p><strong>${cls === "low" ? "What we looked at:" : "Why we are worried:"}</strong></p>
          <ul>${reasons}</ul>
          <details><summary>🔍 See how we checked (for experts)</summary>
            <div class="tech"><div class="row"><span>Safety score (higher is safer)</span>
              <span style="color:${valueColor(d.reputation_score + ' / 100')}">${esc(d.reputation_score)} / 100</span></div></div>
            ${techRow("Words used", t.rule_score)}
            ${techRow("Is it normal for this person?", t.sender_score)}
            ${techRow("Links", t.link_score)}
            ${techRow("Computer helper (weak hint)", t.ml_score)}
          </details>
        </div>`;
    } catch (err) {
      out.innerHTML = "<p style='color:#c0392b;text-align:center'>Sorry, we could not check this message. Please try again.</p>";
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("scanBtn").addEventListener("click", checkMessage);
  document.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => {
    document.getElementById("senderInput").value = b.dataset.s;
    document.getElementById("messageInput").value = b.dataset.m;
    checkMessage();
  }));
</script>
</body>
</html>
