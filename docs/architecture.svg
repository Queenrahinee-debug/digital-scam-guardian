<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Digital Scam Guardian architecture</title><desc>Messages enter through a standard input, pass through four analysis layers inside a local boundary, are combined by a risk engine, and shown as a warning screen. Platform adapters are planned.</desc><rect width="680" height="560" fill="#FFFFFF"/><rect x="40" y="30" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="175.0" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#085041">Prototype 1: web demo form</text><text x="175.0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">Sender + pasted message</text><rect x="370" y="30" width="270" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/><text x="505.0" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#444441">Future: platform adapters</text><text x="505.0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Share, notifications, SMS</text><path d="M175 82V116" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="170,113 175,118 180,113" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M505 82V116" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><polyline points="500,113 505,118 510,113" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="118" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.